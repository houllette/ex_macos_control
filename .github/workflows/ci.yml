name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - elixir: '1.19'
            otp: '28'
          - elixir: '1.20'
            otp: '29'
    env:
      MIX_ENV: test
      MIX_BUILD_PATH: tmp/build
      MIX_DEPS_PATH: tmp/deps
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: |
          mkdir -p tmp
          printf 'TMPDIR=%s/tmp\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - run: mix deps.get --check-locked
      - run: mix compile --warnings-as-errors
      - run: mix quality
      - run: mix test --warnings-as-errors

  native:
    runs-on: macos-26
    strategy:
      matrix:
        include:
          - elixir: '1.19'
            otp: '28'
          - elixir: '1.20'
            otp: '29'
    env:
      MIX_ENV: test
      MIX_BUILD_PATH: tmp/build
      MIX_DEPS_PATH: tmp/deps
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: |
          mkdir -p tmp
          printf 'TMPDIR=%s/tmp\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - run: mix deps.get --check-locked
      - name: Native execution and generated source contracts
        run: >-
          mix test --warnings-as-errors --include integration
          test/ex_macos_control/script_output_test.exs
          test/ex_macos_control/osascript_adapter_script_file_test.exs
          test/ex_macos_control/osascript_adapter_telemetry_test.exs
          test/integration/enhanced_applescript_integration_test.exs
          test/integration/script_file_integration_test.exs
          test/integration/fixtures_integration_test.exs
          test/integration/execution_contract_test.exs
          test/integration/tooling_contract_test.exs
          test/integration/wrapper_contract_test.exs
          test/integration/app_compatibility_contract_test.exs
          test/integration/compositions_contract_test.exs
          test/integration/verified_draft_contract_test.exs
          test/integration/qualification_contract_test.exs
